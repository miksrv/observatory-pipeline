services:
  # Host-side data paths all hang off HOST_DATA_DIR (read from .env for
  # compose interpolation): unset = ~/Developer/data (macOS development),
  # HOST_DATA_DIR=/data on a Linux server. The layout underneath is the same.
  #
  # Watches FITS_INCOMING and submits arriving frames as batched ANALYZE tasks
  # (watcher.py); `worker` below does the processing. Shares every volume with
  # `worker` except the cache dir, which watcher.py never reads/writes itself.
  pipeline:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # On SIGTERM the watcher submits its buffered files as one ANALYZE task;
    # with the API client's retries that can outlast Docker's default 10 s.
    stop_grace_period: 1m
    volumes:
      # Bind-mount the source tree itself so code edits on the host are picked
      # up by a container restart (`docker compose restart pipeline`) instead
      # of a full rebuild. Safe alongside the image's own `COPY . .` — this
      # just overlays /app with the live host copy at container start; the
      # apt packages, astap binary, and pip-installed dependencies baked into
      # the image at build time live outside /app and are unaffected. A
      # rebuild is still required after changing requirements.txt or the
      # Dockerfile itself.
      - .:/app
      - ${HOST_DATA_DIR:-~/Developer/data}/fits/incoming:/fits/incoming
      - ${HOST_DATA_DIR:-~/Developer/data}/fits/archive:/fits/archive
      - ${HOST_DATA_DIR:-~/Developer/data}/fits/rejected:/fits/rejected
      - ${HOST_DATA_DIR:-~/Developer/data}/fits/raw:/fits/raw
      - ${HOST_DATA_DIR:-~/Developer/data}/astap/catalogs:/astap/catalogs
      # Persistent log files (logging_setup.py, LOG_DIR below): watcher.log and
      # worker.log, size-rotated. Docker's own log is deleted with the container
      # on every `down` / recreate; this directory survives both.
      - ${HOST_DATA_DIR:-~/Developer/data}/logs:/logs
    env_file:
      - .env
    environment:
      LOG_DIR: /logs
    # The file logs above are the history to keep; Docker's own copy only
    # needs to cover `docker compose logs`, so it is capped (3 × 10 MB).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Polls the observatory-api task queue (ANALYZE / DETECT_ANOMALIES /
  # GENERATE_CHARTS / PREVIEW_CATALOG_MATCH / DELETE_FRAME / RESTART) and
  # dispatches items to the corresponding
  # pipeline.py entry point — see worker.py and CLAUDE.md's job-queue section.
  # A separate service (not a thread inside `pipeline`) so it can be scaled,
  # restarted, or stopped independently of the filesystem watcher. RESTART
  # tasks cause a clean exit — `restart: unless-stopped` below ensures Docker
  # brings the container back up, which re-fetches remote settings on startup.
  worker:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "worker.py"]
    # On SIGTERM the worker finishes the item in progress before exiting (an
    # ANALYZE item takes a minute or more), then puts any unstarted items back
    # on the queue. Docker's default 10 s would SIGKILL it mid-item and leave
    # the task stuck RUNNING. 10 min: POST /sources alone may take 3 × 180 s
    # (API_SOURCES_TIMEOUT_SEC with the client's retries).
    stop_grace_period: 10m
    volumes:
      - .:/app
      - ${HOST_DATA_DIR:-~/Developer/data}/fits/incoming:/fits/incoming
      - ${HOST_DATA_DIR:-~/Developer/data}/fits/archive:/fits/archive
      - ${HOST_DATA_DIR:-~/Developer/data}/fits/rejected:/fits/rejected
      - ${HOST_DATA_DIR:-~/Developer/data}/fits/raw:/fits/raw
      - ${HOST_DATA_DIR:-~/Developer/data}/astap/catalogs:/astap/catalogs
      # Deliberately a path OUTSIDE the container's own writable layer (a
      # host directory bind-mounted in, exactly like the /fits/* dirs above)
      # so the on-disk catalog cache (modules/catalog_matcher.py) survives a
      # container rebuild/recreate instead of being thrown away with it —
      # important while iterating during testing, when this gets restarted
      # often. In a non-Docker production deployment CATALOG_CACHE_DIR is
      # just a plain directory on the host; this bind mount is a dev/Docker
      # convenience, not something the cache logic itself depends on.
      - ${HOST_DATA_DIR:-~/Developer/data}/cache/catalog:/cache/catalog
      - ${HOST_DATA_DIR:-~/Developer/data}/logs:/logs
    env_file:
      - .env
    environment:
      LOG_DIR: /logs
    # Same log setup as `pipeline` above.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
